name: Bug
description: Something draws wrong, does the wrong thing, or doesn't install.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Orb skin
        - Field skin
        - Setup card or Marketplace / HACS install
        - "@dashhaus/deploy (command line)"
        - create-dashhaus-skin
        - "@dashhaus/core hooks in my own app"
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A screenshot helps for anything you can see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The card's YAML (with your entity ids if you're happy to share them), and what you pressed.
      render: yaml
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Dashhaus version, Home Assistant version, and the browser or app you saw it in.
      placeholder: Dashhaus 0.2.1, Home Assistant 2026.11, iOS companion app
    validations:
      required: true
  - type: textarea
    id: entity
    attributes:
      label: The entity's state
      description: From Developer tools → States, if the bug is about one entity. Remove anything you'd rather not share.
      render: yaml
