name: Idea or new card
description: A card for a domain Dashhaus doesn't draw yet, or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: The Home Assistant domain or device, and what you want to see or do on the dashboard.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you do today instead, and what's in the way.
  - type: dropdown
    id: skin
    attributes:
      label: Which skin
      options:
        - Both
        - Orb
        - Field
        - My own skin (the hooks or the scaffolder)
