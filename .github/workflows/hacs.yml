name: HACS

# The Home Assistant Marketplace and HACS validate a dashboard plugin with the same action: hacs.json, the release
# carrying dashhaus.js, the README, the repository's description and topics. It reads the repository through GitHub's
# public API, so it can only pass once the repository is public; until then the job skips itself and the run stays
# green, and making the repository public turns it on. spec/release.md → The Marketplace.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      # The action is a wrapper around the Docker image ghcr.io/hacs/action:main, which HACS rebuilds from its integration
      # as its rules change. The pin, main as of 2026-11-04, holds only the wrapper, like every action here; the checks
      # and their rules always come from that image, so they are the ones the Marketplace and the HACS catalog apply
      # today, and the pin needs no bump to stay current. Dependabot doesn't move it (HACS tags no current release; its
      # last, 22.5.0, is from 2022); bump it by hand only if the wrapper itself changes.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin
