name: Docs

# The human documentation site (docs/) with Storybook under /storybook, built on every pull request, and deployed to
# GitHub Pages from main once the repository is public: Pages is unavailable to a private repository, so the deploy job
# would otherwise fail the whole run on every push to main. Before the first deploy, Pages must be set to deploy from
# GitHub Actions in the repository settings.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Corepack may otherwise ask before downloading the pinned npm in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:docs
      # Nothing reads this artifact until the deploy job below can run, and a private repository's artifact quota is small.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    # Only a public repository can serve Pages, so deploying before launch would turn every push to main red. A missing
    # or non-public `visibility` skips the job, and making the repository public turns it on.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
