name: CI

on:
  pull_request:
  push:

env:
  # Corepack may otherwise ask before downloading the pinned npm in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

permissions:
  contents: read

# A newer commit on the same branch or pull request supersedes the run in progress. Push and pull_request runs keep
# separate groups, so one never cancels the other, and main keeps every run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every lane checks out, then installs through .github/actions/setup. Why the lanes are shaped as they are is in
# spec/release.md → CI.
jobs:
  # Typecheck, lint and the Lovelace bundle, on the tool caches so an unchanged file isn't checked again.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tool-cache: "true"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:ha

  # Every unit suite but the generator copies, one runner: Vitest's vmForks pool loads jsdom once per worker.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:unit -- --maxWorkers=2

  # The generator suites copy the repo and run its tools inside each copy, mostly one process at a time. All four on
  # one runner took longer than a Storybook shard, so they run on two: the new-skin copy, which builds two skins and
  # Storybook, beside the short regeneration copy (the fan drawn again from its description), and the new-card and
  # Field copies side by side. Each copy's typecheck starts from the restored incremental state.
  generators_shard:
    name: generators (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: new-skin, regenerate
            files: scripts/new-skin/index.test.ts scripts/new-card/regenerate.test.ts
          - name: new-card, field
            files: scripts/new-card/index.test.ts scripts/new-skin/field.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tool-cache: restore
      # verify/projects.test.ts holds every generator suite to exactly one shard, so a new one can't be left out.
      - run: npx vitest run --config config/vitest.config.ts --maxWorkers=2 ${{ matrix.files }}

  # The release proof and the consumer journeys (spec/journeys.md) from freshly packed tarballs, never the workspace:
  # the user installs the bundle's dashhaus.js as the Marketplace does and presses the setup card's Create in Chromium,
  # or installs only the bundle and the deploy CLI; the skin author scaffolds, tests, builds and deploys a standalone
  # skin, then opens and closes the generated cards' details in Chromium; the developer installs core alone and draws a
  # light through its hook. All run against the fake Home Assistant in verify/dx/, so this lane needs no live instance;
  # the skin's and the developer's installs reach the registry for React, Vite and TypeScript.
  dx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: npm run release:pack
      - run: npm run verify:packages
      - run: node verify/dx/marketplace.js
      - run: node verify/dx/user.js
      - run: node verify/dx/author.js
      - run: node verify/dx/developer.js

  # The runner splits by suite; each shard builds the same static site (in Storybook's test mode, without the docs
  # pages, which the Docs workflow builds) and runs its half.
  storybook_shard:
    name: storybook (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: npm run test-storybook -- --shard=${{ matrix.shard }}/2 --maxWorkers=2

  # The required status check: green only when the checks, the unit and generator suites and the DX journeys are green.
  check:
    needs: [checks, unit, generators_shard, dx]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks, the unit and generator suites and the DX journeys
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "unit: ${{ needs.unit.result }}"
          echo "generators: ${{ needs.generators_shard.result }}"
          echo "dx: ${{ needs.dx.result }}"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.generators_shard.result }}" = "success"
          test "${{ needs.dx.result }}" = "success"

  # The required status check: green only when both Storybook shards are green.
  storybook:
    needs: [storybook_shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both Storybook shards
        run: |
          echo "storybook shards: ${{ needs.storybook_shard.result }}"
          test "${{ needs.storybook_shard.result }}" = "success"
