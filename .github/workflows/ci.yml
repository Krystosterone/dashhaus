name: CI

on:
  pull_request:
  push:

env:
  # Corepack may otherwise ask before downloading the pinned npm in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: corepack enable npm && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run test:generators
      - run: npm run build:ha
      - run: npm run release:pack
      - run: npm run verify:packages

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: corepack enable npm && npm --version
      - run: npm ci
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test-storybook
