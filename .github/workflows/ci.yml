name: CI

on:
  pull_request:
  push:

env:
  # Corepack may otherwise ask before downloading the pinned npm in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # Typecheck, lint, the unit suites and the release proof. The generator tests run in their own lane
  # because they dominate this one; `check` below is the required status check for both.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: corepack enable npm && npm --version
      - run: npm ci
      - name: Cache TypeScript's incremental state
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Cache ESLint's lint results
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'config/tsconfig.base.json', 'tsconfig.json', 'packages/*/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'config/tsconfig.base.json', 'tsconfig.json', 'packages/*/tsconfig.json') }}-
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build:ha
      - run: npm run release:pack
      - run: npm run verify:packages

  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: corepack enable npm && npm --version
      - run: npm ci
      - run: npm run test:generators

  # The required status check: green only when both lanes above are green.
  check:
    needs: [unit, generators]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the unit and generator lanes
        run: |
          echo "unit: ${{ needs.unit.result }}"
          echo "generators: ${{ needs.generators.result }}"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.generators.result }}" = "success"

  # The runner dominates the gate, so it splits by suite; each shard builds the same static site and
  # runs its half. The `storybook` job below is the required check for both.
  storybook_one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: corepack enable npm && npm --version
      - run: npm ci
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test-storybook -- --shard=1/2

  storybook_two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: corepack enable npm && npm --version
      - run: npm ci
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test-storybook -- --shard=2/2

  # The required status check: green only when both Storybook shards are green.
  storybook:
    needs: [storybook_one, storybook_two]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both Storybook shards
        run: |
          echo "storybook_one: ${{ needs.storybook_one.result }}"
          echo "storybook_two: ${{ needs.storybook_two.result }}"
          test "${{ needs.storybook_one.result }}" = "success"
          test "${{ needs.storybook_two.result }}" = "success"
