name: Release

# Merging a release PR ships it: the push to main that moves core's version (every package shares it) to one with no
# tag yet runs this (as does one that refreshes an unshipped release's digests after its build refused them), and it
# publishes the five packages to npm and tags v<version>. Orb's and Field's resources ship inside their packages, and
# their own repositories mirror them from npm (spec/release.md → The skin repositories). It makes no GitHub release:
# HACS reads only releases, so the combined install's people stay on its last one, which still carries dashhaus.js,
# rather than being offered an update with no file in it (spec/release.md → The combined install's sunset). Everything it ships was decided and reviewed in that PR
# (spec/release.md → Releasing): the version, the notes, and the files' SHA-256 in spec/releases/<version>.sha256,
# which the build must reproduce before anything leaves. It takes no inputs and runs no model.
#
# The jobs run least reversible last: npm, then the registry smoke, then the tag. Every job looks before it acts, so rerunning the workflow, or dispatching it on main, finishes a
# release that stopped partway and does nothing to one that shipped.
on:
  push:
    branches: [main]
    paths: [packages/core/package.json, "spec/releases/*.sha256"]
  workflow_dispatch:

env:
  # Corepack may otherwise ask before downloading the pinned npm in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Read-only by default: the build runs the repository's install and scripts, so only the jobs that ship what it built
# get to write, and they run none of them.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Whether this commit has a release to ship: its version is untagged, or tagged at this very commit (a rerun).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release ships from main, not $GITHUB_REF"
            exit 1
          fi
          version=$(jq -r .version packages/core/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          if at=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$version" --jq .sha 2>/dev/null); then
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::notice::v$version is already released, at ${at:0:7}; nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$version is tagged at this commit: finishing its release"
          fi
          for file in "spec/releases/$version.md" "spec/releases/$version.sha256"; do
            test -f "$file" || { echo "::error::$file is missing: a release starts with npm run release, in a pull request"; exit 1; }
          done
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: the files every Home Assistant and npm install get are built from this commit and the lockfile, not
      # from a node_modules another workflow's job may have saved.
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: npm run build:ha
      - run: npm run release:pack
      # The tarballs about to be published, installed into a clean app, as CI's dx lane does on every push.
      - run: npm run verify:packages
      # One build for every way in: each skin's resource inside its package, which its Marketplace repository mirrors
      # from npm, is the file build:ha writes.
      - name: Check each skin's resource is the file build:ha writes
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/core/package.json)
          for skin in orb field; do
            tar -xOzf "release/dashhaus-$skin-$version.tgz" "package/dist/$skin-dashboard.js" | cmp - "dist/$skin-dashboard.js"
          done
      # The gate: this clean build reproduces, byte for byte, the files the release PR recorded and was reviewed on.
      - run: node scripts/release/candidate.js check --always
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            release/*.tgz
            release/publish.tsv
          if-no-files-found: error

  # npm trusted publishing: npm accepts this workflow's OIDC identity in place of a token, so there is no npm token
  # secret and no 2FA prompt, and every version carries a provenance attestation naming this repository, workflow and
  # commit. Each package's trusted publisher on npmjs.com names this repository, `release.yml` and the `npm`
  # environment (spec/release.md → Publishing). The job checks out the commit only for .nvmrc, the pinned npm and the
  # setup action; it installs nothing and runs none of the repository's scripts, only `npm publish` on the tarballs the
  # build packed.
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: release
      # In publish.tsv's order, so every internal range resolves the moment it is published. A version npm already has
      # is skipped when it is this very file, and stops the run when it is any other: npm never takes a version twice.
      # It asks npm's document for the one version, never the package's index (`npm view`), which npm's CDN would keep
      # for five minutes without the version about to be published; any other answer than the document or a 404 stops.
      - name: Publish to npm
        run: |
          set -euo pipefail
          tag=latest
          [ "$PRERELEASE" = true ] && tag=next
          while IFS=$'\t' read -r name version file; do
            answer=$(curl -sS --retry 3 -w '\n%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")
            code=${answer##*$'\n'}
            case "$code" in
              200) published=$(node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).dist.shasum' <<< "${answer%$'\n'*}") ;;
              404) published= ;;
              *)
                echo "::error::npm answered $code for $name@$version, so whether it is published is unknown"
                exit 1
                ;;
            esac
            if [ -n "$published" ]; then
              if [ "$published" = "$(sha1sum "release/$file" | cut -d' ' -f1)" ]; then
                echo "$name@$version is already on npm, this very file; skipped"
                continue
              fi
              echo "::error::$name@$version is on npm as a different file ($published); a version can't be published twice"
              exit 1
            fi
            # A prerelease never becomes what `npm install <name>` resolves.
            npm publish "./release/$file" --provenance --ignore-scripts --tag "$tag"
          done < release/publish.tsv

  # The registry smoke: what npm now serves is byte for byte what this commit packed, and the clean-room journeys pass
  # from it. Read-only, like the build. Its time covers release:registry's ten-minute wait for npm, then the journeys.
  registry:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: release
      - run: npm run release:registry -- "$VERSION" --out registry --compare release
      - run: node verify/dx/skin.js --tarballs registry
      - run: node verify/dx/user.js --tarballs registry
      - run: node verify/dx/author.js --tarballs registry
      - run: node verify/dx/developer.js --tarballs registry

  # Last: the tag v<version> at this commit, which marks the release shipped (plan stands down on it). No GitHub
  # release: the combined install's people stay on its last one in HACS.
  tag:
    needs: [plan, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - name: Tag the release
        run: |
          set -euo pipefail
          if at=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
            echo "$TAG is already at ${at:0:7}"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "tagged $TAG at ${GITHUB_SHA:0:7}"
