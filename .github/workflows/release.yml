name: Release

# A published GitHub release gets the Lovelace bundle as its asset, dashhaus.js, built from the release's tag: the file
# the Home Assistant Marketplace and HACS install. Publishing the release (and its tag) stays the operator's step,
# spec/release.md → The Marketplace; this only attaches what the tag builds, so the asset can never differ from it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release's tag to build and attach dashhaus.js to
        required: true

env:
  # Corepack may otherwise ask before downloading the pinned npm in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Read-only by default: the build runs the repository's install and scripts, so only the job that uploads the built
# file gets to write, and it runs none of them.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # git describe names the build in the bundle's console line.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build:ha
      # The Marketplace takes the release's tag as the version and the asset named after the repository as the file.
      - name: Check the tag is the packages' version
        run: test "${TAG#v}" = "$(node -p "require('./packages/bundle/package.json').version")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashhaus.js
          path: dist/dashhaus.js
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dashhaus.js
          path: dist
      - name: Attach dashhaus.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/dashhaus.js --clobber --repo "$GITHUB_REPOSITORY"
