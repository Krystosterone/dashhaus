# Weekly, grouped, so updates arrive as a few pull requests rather than many. CI runs on each; nothing merges itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 is the native compiler, with no JavaScript API, and typescript-eslint 8 peers on typescript
    # `<6.1.0`: `npm ci` refuses 7 and lint cannot load it. Lift this when typescript-eslint supports 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
