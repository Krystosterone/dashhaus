<!-- Phone baseline for the preview frame, as a dashboard host page should have it:
     edge to edge under the notch (the sheet pads itself with env(safe-area-inset-bottom)), zoom left
     enabled, the keyboard resizing content, and a status bar colour per scheme matching the page top. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e1e3e5" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0e" />
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  html, body { min-height: 100%; }
</style>
