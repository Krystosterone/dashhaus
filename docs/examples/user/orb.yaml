type: custom:dashhaus-orb
title: Home
rows:
  - title: At a glance
    columns: 3
    align: bottom
    cards:
      - entity: climate.living_room
        column: 1
        width: 2
        footprint: featured
      - entity: alarm_control_panel.house
        column: 3
      - entity: light.living_room
        column: 3
        footprint: compact
  - title: Around the house
    columns: 3
    flow: dense
    cards:
      - entity: weather.home
        width: 2
      - entity: cover.living_room
        column: 3
        footprint: compact
      - entity: sensor.living_room_temperature
        width: 2
      - entity: switch.porch
        footprint: compact
      - bundle: joined
        label: Modes
        width: full
        cards: [input_boolean.guest_mode, input_boolean.dnd, switch.office]
